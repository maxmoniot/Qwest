<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwest - Mode Projection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        
        .projection-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }
        
        .projection-controls {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .projection-controls-left {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .projection-code {
            font-size: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
        }
        
        .projection-info {
            display: flex;
            gap: 15px;
            font-size: 16px;
            font-weight: 600;
        }
        
        .projection-info-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 6px;
        }
        
        .projection-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .projection-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .projection-btn.btn-success {
            background: rgba(76, 175, 80, 0.8);
            border-color: rgba(76, 175, 80, 1);
        }
        
        .projection-btn.btn-danger {
            background: rgba(244, 67, 54, 0.8);
            border-color: rgba(244, 67, 54, 1);
        }
        
        .projection-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .projection-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }
        
        .projection-waiting {
            text-align: center;
        }
        
        .projection-waiting h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .projection-waiting p {
            font-size: 32px;
            opacity: 0.9;
        }
        
        .projection-question-screen {
            background: white;
            color: #212121;
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 1400px;
            max-height: 85vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .projection-question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #e0e0e0;
            flex-shrink: 0;
        }
        
        .projection-question-number {
            font-size: 20px;
            font-weight: 600;
            color: #757575;
        }
        
        .projection-timer {
            font-size: 28px;
            font-weight: 700;
            color: #2196F3;
        }
        
        .projection-question-image {
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            max-height: 250px;
        }
        
        .projection-question-image img {
            width: 100%;
            height: 100%;
            max-height: 250px;
            object-fit: contain;
        }
        
        .projection-question-text {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            flex-shrink: 0;
        }
        
        .projection-answers {
            display: grid;
            gap: 15px;
            flex: 1;
            min-height: 0;
            align-content: start;
        }
        
        .projection-answers.grid-2 {
            grid-template-columns: 1fr 1fr;
        }
        
        .projection-answers.grid-4 {
            grid-template-columns: 1fr 1fr;
        }
        
        .projection-answer {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 4px solid #e0e0e0;
        }
        
        .projection-answer-label {
            width: 45px;
            height: 45px;
            background: #2196F3;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .projection-order-instruction,
        .projection-freetext-instruction {
            font-size: 28px;
            color: #757575;
            margin-bottom: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .projection-top3 {
            text-align: center;
            color: white;
        }
        
        .projection-top3 h1 {
            font-size: 64px;
            margin-bottom: 40px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .projection-podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            margin-top: 60px;
        }
        
        .projection-podium-place {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            min-width: 250px;
            text-align: center;
        }
        
        .projection-podium-place.first {
            order: 2;
            transform: scale(1.1);
            background: rgba(255, 215, 0, 0.3);
        }
        
        .projection-podium-place.second {
            order: 1;
        }
        
        .projection-podium-place.third {
            order: 3;
        }
        
        .projection-podium-medal {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        .projection-podium-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .projection-podium-score {
            font-size: 48px;
            font-weight: 700;
            color: #FFD700;
        }
        
        .projection-final {
            text-align: center;
            color: white;
        }
        
        .projection-final h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .projection-final p {
            font-size: 36px;
            opacity: 0.9;
        }
        
        /* Classement général entre les questions */
        .projection-ranking {
            width: 90%;
            max-width: 1200px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            color: white;
        }
        
        .projection-ranking-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .projection-ranking-header h1 {
            font-size: 56px;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .projection-ranking-header .question-info {
            font-size: 24px;
            opacity: 0.9;
        }
        
        .projection-ranking-content {
            display: flex;
            gap: 40px;
            flex: 1;
            min-height: 0;
        }
        
        /* Podium à gauche */
        .projection-ranking-podium {
            flex: 0 0 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .ranking-podium-container {
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }
        
        .ranking-podium-place {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            min-width: 120px;
        }
        
        .ranking-podium-place.first {
            order: 2;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.4), rgba(255, 193, 7, 0.3));
            transform: scale(1.15);
            min-width: 140px;
        }
        
        .ranking-podium-place.second {
            order: 1;
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.3), rgba(158, 158, 158, 0.2));
        }
        
        .ranking-podium-place.third {
            order: 3;
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.3), rgba(139, 90, 43, 0.2));
        }
        
        .ranking-podium-medal {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .ranking-podium-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        
        .ranking-podium-score {
            font-size: 28px;
            font-weight: 700;
            color: #FFD700;
        }
        
        .ranking-podium-place.second .ranking-podium-score {
            color: #C0C0C0;
        }
        
        .ranking-podium-place.third .ranking-podium-score {
            color: #CD7F32;
        }
        
        /* Liste des autres joueurs à droite */
        .projection-ranking-list {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .ranking-list-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .ranking-list-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            transition: background 0.2s;
        }
        
        .ranking-list-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .ranking-list-position {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            margin-right: 15px;
        }
        
        .ranking-list-name {
            flex: 1;
            font-size: 20px;
            font-weight: 600;
        }
        
        .ranking-list-score {
            font-size: 22px;
            font-weight: 700;
            color: #FFD700;
        }
        
        .ranking-list-empty {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
            font-size: 18px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .projection-question-screen {
            animation: fadeIn 0.5s ease;
        }
        
        /* Modale de confirmation */
        .projection-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .projection-modal-overlay.active {
            display: flex;
        }
        
        .projection-modal {
            background: white;
            color: #212121;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .projection-modal-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .projection-modal-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .projection-modal-message {
            font-size: 18px;
            text-align: center;
            color: #616161;
            margin-bottom: 30px;
        }
        
        .projection-modal-buttons {
            display: flex;
            gap: 15px;
        }
        
        .projection-modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .projection-modal-btn-secondary {
            background: #e0e0e0;
            color: #212121;
        }
        
        .projection-modal-btn-secondary:hover {
            background: #bdbdbd;
        }
        
        .projection-modal-btn-primary {
            background: #f44336;
            color: white;
        }
        
        .projection-modal-btn-primary:hover {
            background: #d32f2f;
        }
        
        /* Modale liste des participants */
        .projection-participants-modal {
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .projection-participants-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }
        
        .projection-participant-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }
        
        .projection-participant-item.disconnected {
            opacity: 0.5;
            border-left-color: #f44336;
        }
        
        .projection-participant-name {
            font-size: 18px;
            font-weight: 600;
        }
        
        .projection-participant-status {
            font-size: 14px;
            color: #616161;
        }
    </style>
</head>
<body>
    <div class="projection-container">
        <div class="projection-controls">
            <div class="projection-controls-left">
                <div class="projection-code">Code : <span id="proj-code">Chargement...</span></div>
                <div class="projection-info">
                    <div class="projection-info-item" onclick="showParticipantsModal()" style="cursor: pointer;" title="Cliquez pour voir la liste">
                        👥 <span id="proj-players">0</span> connectés
                    </div>
                    <div class="projection-info-item">📊 Q <span id="proj-progress">0/0</span></div>
                </div>
                <button class="projection-btn btn-success" onclick="projStartGame()" id="proj-btn-start">▶️ Lancer la partie</button>
                <button class="projection-btn" onclick="projPauseGame()" id="proj-btn-pause" disabled>⏸️ Pause</button>
                <button class="projection-btn" onclick="projNextQuestion()" id="proj-btn-next" disabled>⏭️ Question suivante</button>
                <button class="projection-btn" onclick="projResyncAll()" id="proj-btn-resync" disabled title="Forcer la resynchronisation de tous les élèves">🔄 Resynchroniser</button>
                <button class="projection-btn" onclick="projEndGame()" id="proj-btn-end" disabled>⏹️ Terminer</button>
            </div>
            <button class="projection-btn btn-danger" onclick="closeProjection()">❌ Quitter la projection</button>
        </div>
        <div class="projection-content" id="proj-content">
            <div class="projection-waiting">
                <h1>⏳ En attente</h1>
                <p>Cliquez sur "Lancer la partie" pour commencer</p>
            </div>
        </div>
    </div>
    
    <!-- Modale de confirmation -->
    <div class="projection-modal-overlay" id="confirm-modal">
        <div class="projection-modal">
            <div class="projection-modal-icon">⚠️</div>
            <h3 class="projection-modal-title">Terminer la partie ?</h3>
            <p class="projection-modal-message">Voulez-vous vraiment terminer la partie maintenant ? Les résultats finaux seront envoyés aux élèves.</p>
            <div class="projection-modal-buttons">
                <button class="projection-modal-btn projection-modal-btn-secondary" onclick="closeConfirmModal()">Annuler</button>
                <button class="projection-modal-btn projection-modal-btn-primary" onclick="confirmEndGame()">Confirmer</button>
            </div>
        </div>
    </div>
    
    <!-- Modale liste des participants -->
    <div class="projection-modal-overlay" id="participants-modal">
        <div class="projection-modal projection-participants-modal">
            <div class="projection-modal-icon">👥</div>
            <h3 class="projection-modal-title">Participants connectés</h3>
            <div class="projection-participants-list" id="participants-list">
                <!-- Liste générée dynamiquement -->
            </div>
            <div class="projection-modal-buttons" style="margin-top: 30px;">
                <button class="projection-modal-btn projection-modal-btn-secondary" onclick="closeParticipantsModal()" style="width: 100%;">Fermer</button>
            </div>
        </div>
    </div>

    <!-- SYNCHRO v2 : la projection charge config.js + clockSync.js pour disposer de
         l'horloge serveur synchronisée (QwestClock) et révéler les questions au même
         instant absolu que les postes élèves. Reste autonome (mode secours) par ailleurs. -->
    <script src="js/config.js?v=20260618e"></script>
    <script src="js/clockSync.js?v=20260618e"></script>
    <script>
        // Récupérer les infos depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const playCode = urlParams.get('code');
        // SYNCHRO v2 : démarrer la synchronisation d'horloge serveur (handshake + resync).
        if (window.QwestClock) window.QwestClock.start();
        // totalQuestions sera mis à jour dynamiquement quand les données arrivent
        let totalQuestions = parseInt(urlParams.get('total')) || 0;
        
        console.log('📽️ PROJECTION: Démarrage avec code=' + playCode + ', total=' + totalQuestions);
        
        // Afficher le code immédiatement
        document.getElementById('proj-code').textContent = playCode || 'N/A';
        
        // État de la projection
        let projectionState = {
            currentScreen: 'waiting',
            questionData: null,
            top3Data: null,
            questions: [],
            lastScreenKey: null,
            participants: [],
            revealTimer: null
        };

        // Délais de révélation des questions, alignés sur l'horloge serveur, pour que le
        // TABLEAU révèle la question EN MÊME TEMPS que les postes élèves (pas avant, ce qui
        // donnait un avantage à ceux qui regardaient l'écran). Mêmes valeurs que config.js
        // (la projection est autonome et ne charge pas config.js).
        const PROJ_FIRST_COUNTDOWN_MS = 3500; // Q0 : même countdown 3-2-1 que les élèves
        const PROJ_REVEAL_DELAY_MS = 1500;    // Q1+ : court, pour ne pas devancer les élèves
        
        // Permet à control.js de pousser une mise à jour immédiate de la projection
        // (après une action prof : start, next, pause, end…) sans attendre le poll
        // périodique. Le fetch lui-même est dans control.js (updateProjectionWindow),
        // donc on lui demande poliment de rafraîchir.
        window.forceUpdate = function() {
            try {
                if (window.opener && typeof window.opener.updateProjectionWindow === 'function') {
                    window.opener.updateProjectionWindow();
                }
            } catch (e) {
                console.warn('📽️ PROJECTION: forceUpdate non disponible (opener fermé ?)', e);
            }
        };

        // Visibility API : quand l'onglet projection redevient visible (l'enseignant
        // y revient ou le projecteur sort de veille), on force une mise à jour pour
        // rattraper toute évolution manquée pendant le throttling navigateur.
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                window.forceUpdate();
            }
        });
        window.addEventListener('pageshow', function() { window.forceUpdate(); });

        // HEARTBEAT vers le pilote (1 s). La projection est LA fenêtre toujours visible
        // (affichée au TBI), donc ses timers ne sont jamais throttlés par le navigateur.
        // Quand l'onglet pilote est caché (cas « un seul écran » : projection plein écran
        // par-dessus), SES timers tombent à 1 tick/min — on a mesuré des passages auto à
        // la question suivante retardés à 60 s pile, et la classe attendait sur le Top 3.
        // Ce battement appelle window.opener.projectionHeartbeat() qui, côté pilote :
        // tire l'avance auto en retard, relance le poll pilote (resync + réparation
        // d'avance perdue) et rafraîchit la projection. Les appels inter-fenêtres ne sont
        // PAS throttlés (seuls les timers le sont) — le fetch s'exécute normalement.
        setInterval(function() {
            try {
                if (window.opener && !window.opener.closed &&
                    typeof window.opener.projectionHeartbeat === 'function') {
                    window.opener.projectionHeartbeat();
                }
            } catch (e) { /* opener fermé ou indisponible : silencieux */ }
        }, 1000);

        // ============================================================
        // MODE SECOURS : projection AUTONOME si la fenêtre pilote meurt
        // ============================================================
        // Tant que le pilote (opener) vit, il pousse les données et reçoit le heartbeat
        // ci-dessus. S'il est fermé ou planté, la projection prend le relais : elle
        // interroge elle-même get_control_state (lecture publique), reconstruit l'écran,
        // et assure le PILOTAGE MINIMAL — fin de question au timeout (+3 s) et avance
        // auto en mode auto — grâce au teacher_hash relayé par le pilote à l'ouverture
        // (conservé en sessionStorage : survit à un reload de la projection après la
        // mort du pilote). La partie continue donc même si le poste prof tombe.
        let relayHash = '';
        try { relayHash = sessionStorage.getItem('qwest_relay_hash_' + playCode) || ''; } catch (e) {}
        try {
            if (!relayHash && window.opener && window.opener.CONFIG && window.opener.CONFIG.TEACHER_PASSWORD_HASH) {
                relayHash = window.opener.CONFIG.TEACHER_PASSWORD_HASH;
                sessionStorage.setItem('qwest_relay_hash_' + playCode, relayHash);
            }
        } catch (e) { /* opener déjà fermé */ }

        const standalone = {
            active: false,
            completedForQ: -1,
            completedSeenAt: 0,
            lastForceTs: 0,
            lastNextTs: 0,
            lastCustomTime: null
        };

        function openerAlive() {
            try {
                return !!(window.opener && !window.opener.closed &&
                          typeof window.opener.projectionHeartbeat === 'function');
            } catch (e) { return false; }
        }

        async function standaloneTick() {
            if (openerAlive()) {
                if (standalone.active) {
                    standalone.active = false;
                    console.log('📽️ PROJECTION: pilote de retour — mode secours désactivé');
                }
                return;
            }
            if (!standalone.active) {
                standalone.active = true;
                console.warn('📽️ PROJECTION: pilote indisponible — MODE SECOURS activé (self-polling)');
            }

            let result;
            try {
                const res = await fetch('php/control.php?action=get_control_state&playCode=' + encodeURIComponent(playCode));
                if (!res.ok) return;
                result = await res.json();
            } catch (e) { return; }
            if (!result || !result.success) return;

            standalone.lastCustomTime = (result.customTime !== undefined) ? result.customTime : null;

            // — même machine à états que updateProjectionWindow (control.js) —
            const stableSort = function(players) {
                return players.slice().sort(function(a, b) {
                    const d = (b.score || 0) - (a.score || 0);
                    if (d !== 0) return d;
                    return String(a.nickname || '').localeCompare(String(b.nickname || ''));
                });
            };
            const data = {
                playCode: playCode,
                state: result.state,
                currentQuestion: result.currentQuestion,
                playersCount: (result.players || []).length,
                participants: result.players || [],
                manualMode: !!result.manualMode,
                paused: result.paused || false,
                screen: 'waiting',
                questions: projectionState.questions,
                totalQuestions: (projectionState.questions || []).length || totalQuestions
            };
            if (result.state === 'finished' || result.state === 'ended') {
                data.screen = 'final';
                data.allPlayers = result.ranking || stableSort(result.players || []);
            } else if (result.questionCompleted || result.resultsAvailable) {
                data.screen = 'ranking';
                const ranked = result.ranking || stableSort(result.players || []);
                data.allPlayers = ranked;
                data.top3 = ranked.slice(0, 3);
            } else if (result.state === 'playing' && result.currentQuestion >= 0) {
                data.screen = 'question';
                data.timeElapsed = (typeof result.timeElapsed === 'number') ? result.timeElapsed : 0;
                data.questionTime = result.questionTime;
                // SYNCHRO v2 : instant absolu d'apparition (ms serveur) pour la révélation
                // alignée via l'horloge synchronisée (cf. revealQuestionAligned).
                data.revealAt = (typeof result.questionRevealAt === 'number') ? result.questionRevealAt : 0;
            }
            try { window.updateProjection(data); } catch (e) { console.warn('📽️ secours: rendu', e); }

            // — pilotage de relève (uniquement si le hash a pu être relayé) —
            if (!relayHash || result.paused) return;

            // 1) Fin de question au timeout (+3 s de grâce), 1 tentative max / 5 s.
            //    force_question_complete est idempotente côté serveur.
            if (result.state === 'playing' && result.currentQuestion >= 0 &&
                !result.questionCompleted &&
                typeof result.timeElapsed === 'number' && typeof result.questionTime === 'number' &&
                (result.timeElapsed - result.questionTime) >= 3 &&
                (Date.now() - standalone.lastForceTs) > 5000) {
                standalone.lastForceTs = Date.now();
                console.warn('📽️ PROJECTION (secours): force_question_complete Q' + result.currentQuestion);
                fetch('php/control.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'force_question_complete',
                        playCode: playCode,
                        questionIndex: result.currentQuestion,
                        teacher_hash: relayHash
                    })
                }).catch(function() {});
            }

            // 2) Avance auto 5 s après la complétion (mode auto uniquement). La cible est
            //    « question serveur + 1 » : idempotent et monotone, aucun saut possible.
            if (result.state === 'playing' && !result.manualMode && result.questionCompleted) {
                if (standalone.completedForQ !== result.currentQuestion) {
                    standalone.completedForQ = result.currentQuestion;
                    standalone.completedSeenAt = Date.now();
                } else if ((Date.now() - standalone.completedSeenAt) >= 5000 &&
                           (Date.now() - standalone.lastNextTs) > 5000) {
                    standalone.lastNextTs = Date.now();
                    const totalQ = (projectionState.questions || []).length || totalQuestions;
                    const target = result.currentQuestion + 1;
                    if (totalQ > 0 && target >= totalQ) {
                        console.warn('📽️ PROJECTION (secours): fin de partie (Q' + target + ' >= ' + totalQ + ')');
                        fetch('php/control.php', {

                            body: new URLSearchParams({
                                action: 'end_game',

                                teacher_hash: relayHash
                            })
                        }).catch(function() {});
                    } else {
                        const params = {
                            action: 'next_question',
                            playCode: playCode,
                            questionIndex: target,
                            teacher_hash: relayHash
                        };
                        if (standalone.lastCustomTime !== null && standalone.lastCustomTime !== undefined) {
                            params.customTime = standalone.lastCustomTime;

                        console.warn('📽️ PROJECTION (secours): next_question → Q' + target);
                        fetch('php/control.php', {

                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams(params)

                    }

            // Ne mettre à jour le contenu QUE si l'écran ou la question a changé
            const screenKey = data.screen + '-' + (data.currentQuestion || 0);
            if (projectionState.lastScreenKey !== screenKey) {
                projectionState.lastScreenKey = screenKey;

                // L'écran change → annuler une éventuelle révélation de question en

        // Révèle la question au TABLEAU en synchronisation avec les postes élèves :
        // compte à rebours aligné sur l'horloge serveur (questionStartTime + délai), puis
        // affichage de la question + réponses au même instant que sur les téléphones.
        // Supprime l'avantage « la question s'affiche d'abord au tableau ».
        function revealQuestionAligned(question, data, total) {
            if (projectionState.revealTimer) {
                clearTimeout(projectionState.revealTimer);
                projectionState.revealTimer = null;
            }
            const content = document.getElementById('proj-content');
            // SYNCHRO v2 : on vise l'instant ABSOLU revealAt (ms serveur) via l'horloge
            // synchronisée → le TABLEAU révèle EXACTEMENT au même instant que les postes
            // élèves, au ms près. Repli (revealAt/horloge absents) : ancien calcul
            // délai - tempsÉcoulé (secondes serveur).
            let wait;
            if (typeof data.revealAt === 'number' && data.revealAt > 0 && window.QwestClock && window.QwestClock.synced) {
                wait = Math.max(0, Math.round(data.revealAt - window.QwestClock.now()));
            } else {
                const delay = (data.currentQuestion === 0) ? PROJ_FIRST_COUNTDOWN_MS : PROJ_REVEAL_DELAY_MS;
                const elapsedMs = (typeof data.timeElapsed === 'number' ? data.timeElapsed : 0) * 1000;
                wait = Math.max(0, delay - elapsedMs);
            }

            if (wait < 250) {
                // Déjà l'heure (projection ouverte tard, ou délai écoulé) → affichage direct.
                content.innerHTML = renderQuestion(question, data.currentQuestion, total);
                return;
            }
            // Compte à rebours, puis révélation synchronisée.
            renderProjectionCountdown(wait);
            const qIndex = data.currentQuestion;
            projectionState.revealTimer = setTimeout(function() {
                projectionState.revealTimer = null;
                const c = document.getElementById('proj-content');
                if (c) c.innerHTML = renderQuestion(question, qIndex, total);
            }, wait);
        }

        // Affiche un compte à rebours plein écran (3-2-1 → GO) jusqu'à la révélation.
        function renderProjectionCountdown(waitMs) {
            const content = document.getElementById('proj-content');
            if (!content) return;
            const startN = Math.max(1, Math.round((waitMs - 400) / 1000));
            content.innerHTML = '<div class="projection-waiting"><h1>🎬 Préparez-vous…</h1>' +
                '<div id="proj-countdown" style="font-size:120px;font-weight:800;margin-top:20px;">' + startN + '</div></div>';
            let n = startN;
            if (projectionState.countdownInterval) clearInterval(projectionState.countdownInterval);
            projectionState.countdownInterval = setInterval(function() {
                n--;
                const el = document.getElementById('proj-countdown');
                if (!el) { clearInterval(projectionState.countdownInterval); projectionState.countdownInterval = null; return; }
                el.textContent = (n > 0) ? n : 'GO ! 🚀';
                if (n <= 0) { clearInterval(projectionState.countdownInterval); projectionState.countdownInterval = null; }
            }, 1000);
        }

        // Mélange DÉTERMINISTE des réponses pour la projection (graine = index de la
        // question). Corrige le bug « la bonne réponse est toujours en premier » : les
        // réponses étaient affichées dans l'ordre de stockage (bonne réponse en A).
        // L'ordre reste STABLE pour une question donnée (pas de re-mélange à chaque
        // rafraîchissement 1,5 s → aucun scintillement). Les élèves voient déjà chacun
        // un ordre aléatoire propre (game.js) ; la projection doit juste ne pas trahir
        // la réponse, un ordre fixe par question suffit.
        function projectionShuffle(arr, seed) {
            const a = (arr || []).slice();
            let s = (seed * 2654435761) >>> 0;
            if (s === 0) s = 1;
            const rand = () => {
                s ^= s << 13; s >>>= 0;
                s ^= s >>> 17;
                s ^= s << 5;  s >>>= 0;
                return (s >>> 0) / 4294967296;
            };
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
            }
            return a;
        }

                    answersHTML += '<div class="projection-answer">';

                    answersHTML += '<div>' + answer.text + '</div>';
                    answersHTML += '</div>';
                });

            } else if (question.type === 'order') {
                // Mélangé aussi : afficher les éléments dans l'ordre de stockage révélait
                // la bonne séquence. Puce neutre « • » au lieu d'un numéro pour ne pas
                // suggérer un ordre.
                const shown = projectionShuffle(question.answers, index + 101);
                answersHTML = '<p class="projection-order-instruction">Remettre les éléments dans le bon ordre</p>';
                answersHTML += '<div class="projection-answers">';
