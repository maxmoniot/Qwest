<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Caractéristiques d'une ville mondiale</text>
  <!-- Ville au centre -->
  <circle cx="350" cy="200" r="80" fill="#1565c0" stroke="#333" stroke-width="2"/>
  <text x="350" y="195" font-size="14" text-anchor="middle" fill="white" font-weight="bold">VILLE</text>
  <text x="350" y="215" font-size="14" text-anchor="middle" fill="white" font-weight="bold">MONDIALE</text>
  <!-- Caractéristiques autour -->
  <!-- 1: Finance -->
  <circle cx="200" cy="100" r="45" fill="#4caf50" stroke="#333"/>
  <text x="200" y="95" font-size="11" text-anchor="middle" fill="white">Centre</text>
  <text x="200" y="110" font-size="11" text-anchor="middle" fill="white">financier</text>
  <line x1="235" y1="130" x2="290" y2="160" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="60" r="12" fill="#e74c3c"/>
  <text x="200" y="65" font-size="12" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <!-- 2: Hub transport -->
  <circle cx="500" cy="100" r="45" fill="#ff9800" stroke="#333"/>
  <text x="500" y="95" font-size="11" text-anchor="middle" fill="white">Hub de</text>
  <text x="500" y="110" font-size="11" text-anchor="middle" fill="white">transport</text>
  <line x1="465" y1="130" x2="410" y2="160" stroke="#333" stroke-width="2"/>
  <circle cx="500" cy="60" r="12" fill="#e74c3c"/>
  <text x="500" y="65" font-size="12" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <!-- 3: Sièges sociaux -->
  <circle cx="550" cy="250" r="45" fill="#9c27b0" stroke="#333"/>
  <text x="550" y="245" font-size="11" text-anchor="middle" fill="white">Sièges de</text>
  <text x="550" y="260" font-size="11" text-anchor="middle" fill="white">FTN</text>
  <line x1="510" y1="230" x2="420" y2="210" stroke="#333" stroke-width="2"/>
  <circle cx="590" cy="220" r="12" fill="#e74c3c"/>
  <text x="590" y="225" font-size="12" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <!-- 4: Culture -->
  <circle cx="150" cy="280" r="45" fill="#00bcd4" stroke="#333"/>
  <text x="150" y="275" font-size="11" text-anchor="middle" fill="white">Rayonnement</text>
  <text x="150" y="290" font-size="11" text-anchor="middle" fill="white">culturel</text>
  <line x1="190" y1="260" x2="280" y2="220" stroke="#333" stroke-width="2"/>
  <circle cx="110" cy="250" r="12" fill="#e74c3c"/>
  <text x="110" y="255" font-size="12" text-anchor="middle" fill="white" font-weight="bold">4</text>
  <!-- Question -->
  <rect x="100" y="350" width="500" height="40" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="368" font-size="11" text-anchor="middle">Citez 3 exemples de villes mondiales :</text>
  <text x="350" y="383" font-size="10" text-anchor="middle" fill="#666">New York, Londres, Tokyo, Paris, Shanghai...</text>
</svg>
