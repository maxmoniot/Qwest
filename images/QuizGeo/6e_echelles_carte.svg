<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#f5f5f5"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les échelles cartographiques</text>
  <!-- Carte 1: Petite échelle (monde) -->
  <rect x="30" y="60" width="160" height="100" fill="#e3f2fd" stroke="#333"/>
  <ellipse cx="110" cy="110" rx="60" ry="35" fill="#a5d6a7" stroke="#666"/>
  <text x="110" y="180" font-size="11" text-anchor="middle" font-weight="bold">Carte A</text>
  <text x="110" y="195" font-size="9" text-anchor="middle">1 cm = 1000 km</text>
  <!-- Carte 2: Échelle moyenne (pays) -->
  <rect x="220" y="60" width="160" height="100" fill="#e3f2fd" stroke="#333"/>
  <path d="M250 80 L300 75 L350 95 L340 140 L280 150 L250 120 Z" fill="#a5d6a7" stroke="#666"/>
  <text x="300" y="180" font-size="11" text-anchor="middle" font-weight="bold">Carte B</text>
  <text x="300" y="195" font-size="9" text-anchor="middle">1 cm = 100 km</text>
  <!-- Carte 3: Grande échelle (ville) -->
  <rect x="410" y="60" width="160" height="100" fill="#e3f2fd" stroke="#333"/>
  <rect x="430" y="80" width="120" height="60" fill="#ffecb3"/>
  <line x1="430" y1="100" x2="550" y2="100" stroke="#666"/>
  <line x1="430" y1="120" x2="550" y2="120" stroke="#666"/>
  <line x1="470" y1="80" x2="470" y2="140" stroke="#666"/>
  <line x1="510" y1="80" x2="510" y2="140" stroke="#666"/>
  <rect x="480" y="90" width="20" height="15" fill="#90a4ae"/>
  <rect x="445" y="105" width="15" height="10" fill="#90a4ae"/>
  <text x="490" y="180" font-size="11" text-anchor="middle" font-weight="bold">Carte C</text>
  <text x="490" y="195" font-size="9" text-anchor="middle">1 cm = 100 m</text>
  <!-- Flèches et labels -->
  <text x="110" y="230" font-size="10" text-anchor="middle" fill="#1565c0">Petite échelle</text>
  <text x="110" y="245" font-size="9" text-anchor="middle" fill="#666">(vision large)</text>
  <text x="490" y="230" font-size="10" text-anchor="middle" fill="#c62828">Grande échelle</text>
  <text x="490" y="245" font-size="9" text-anchor="middle" fill="#666">(vision détaillée)</text>
  <line x1="150" y1="235" x2="450" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Question -->
  <rect x="100" y="270" width="400" height="50" fill="white" stroke="#ddd" rx="5"/>
  <text x="300" y="295" font-size="11" text-anchor="middle">Pour voir les rues d'une ville, quelle échelle utiliser ?</text>
  <text x="300" y="312" font-size="10" text-anchor="middle" fill="#666">A (petite) | B (moyenne) | C (grande)</text>
</svg>
