<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#f5f5f5"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle">La déforestation dans le monde</text>
  <!-- Forêt préservée -->
  <rect x="30" y="60" width="250" height="180" fill="#c8e6c9" stroke="#333"/>
  <text x="155" y="85" font-size="12" text-anchor="middle" font-weight="bold">Avant</text>
  <!-- Arbres denses -->
  <ellipse cx="70" cy="150" rx="25" ry="35" fill="#2e7d32"/>
  <ellipse cx="110" cy="140" rx="30" ry="40" fill="#388e3c"/>
  <ellipse cx="155" cy="150" rx="28" ry="38" fill="#2e7d32"/>
  <ellipse cx="200" cy="145" rx="32" ry="42" fill="#388e3c"/>
  <ellipse cx="240" cy="155" rx="26" ry="36" fill="#2e7d32"/>
  <ellipse cx="85" cy="200" rx="30" ry="35" fill="#43a047"/>
  <ellipse cx="135" cy="195" rx="28" ry="38" fill="#2e7d32"/>
  <ellipse cx="185" cy="200" rx="32" ry="40" fill="#388e3c"/>
  <ellipse cx="230" cy="205" rx="25" ry="32" fill="#43a047"/>
  <!-- Forêt détruite -->
  <rect x="320" y="60" width="250" height="180" fill="#d7ccc8" stroke="#333"/>
  <text x="445" y="85" font-size="12" text-anchor="middle" font-weight="bold">Après</text>
  <!-- Souches et terrain nu -->
  <ellipse cx="360" cy="200" rx="15" ry="8" fill="#5d4037"/>
  <ellipse cx="420" cy="180" rx="12" ry="6" fill="#5d4037"/>
  <ellipse cx="480" cy="195" rx="14" ry="7" fill="#5d4037"/>
  <ellipse cx="380" cy="150" rx="10" ry="5" fill="#5d4037"/>
  <ellipse cx="450" cy="160" rx="13" ry="6" fill="#5d4037"/>
  <ellipse cx="520" cy="170" rx="11" ry="5" fill="#5d4037"/>
  <!-- Un arbre restant -->
  <ellipse cx="530" cy="130" rx="18" ry="25" fill="#66bb6a"/>
  <!-- Fumée/Feu -->
  <path d="M350 120 Q360 100 355 80" stroke="#757575" stroke-width="3" fill="none"/>
  <path d="M400 110 Q410 90 405 70" stroke="#757575" stroke-width="3" fill="none"/>
  <circle cx="350" cy="130" r="10" fill="#ff5722" opacity="0.7"/>
  <!-- Question -->
  <rect x="100" y="260" width="400" height="70" fill="white" stroke="#ddd" rx="5"/>
  <text x="300" y="285" font-size="11" text-anchor="middle" font-weight="bold">Quelles sont les causes principales de la déforestation ?</text>
  <text x="300" y="305" font-size="10" text-anchor="middle" fill="#666">Agriculture, élevage, exploitation du bois, urbanisation</text>
  <text x="300" y="322" font-size="10" text-anchor="middle" fill="#666">Quelle forêt tropicale est la plus menacée ?</text>
</svg>
