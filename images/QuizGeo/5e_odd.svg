<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#f5f5f5"/>
  <text x="350" y="30" font-size="16" font-weight="bold" text-anchor="middle">Les 17 Objectifs de Développement Durable (ODD)</text>
  <!-- Grille ODD simplifiée -->
  <rect x="30" y="50" width="70" height="50" fill="#e5243b"/><text x="65" y="80" font-size="10" fill="white" text-anchor="middle">1.Pauvreté</text>
  <rect x="110" y="50" width="70" height="50" fill="#dda63a"/><text x="145" y="80" font-size="10" fill="white" text-anchor="middle">2.Faim</text>
  <rect x="190" y="50" width="70" height="50" fill="#4c9f38"/><text x="225" y="80" font-size="10" fill="white" text-anchor="middle">3.Santé</text>
  <rect x="270" y="50" width="70" height="50" fill="#c5192d"/><text x="305" y="80" font-size="10" fill="white" text-anchor="middle">4.Éducation</text>
  <rect x="350" y="50" width="70" height="50" fill="#ff3a21"/><text x="385" y="80" font-size="10" fill="white" text-anchor="middle">5.Égalité</text>
  <rect x="430" y="50" width="70" height="50" fill="#26bde2"/><text x="465" y="80" font-size="10" fill="white" text-anchor="middle">6.Eau</text>
  <rect x="510" y="50" width="70" height="50" fill="#fcc30b"/><text x="545" y="80" font-size="10" fill="#333" text-anchor="middle">7.Énergie</text>
  <rect x="590" y="50" width="70" height="50" fill="#a21942"/><text x="625" y="80" font-size="10" fill="white" text-anchor="middle">8.Travail</text>
  <rect x="30" y="110" width="70" height="50" fill="#fd6925"/><text x="65" y="140" font-size="9" fill="white" text-anchor="middle">9.Industrie</text>
  <rect x="110" y="110" width="70" height="50" fill="#dd1367"/><text x="145" y="140" font-size="9" fill="white" text-anchor="middle">10.Inégalités</text>
  <rect x="190" y="110" width="70" height="50" fill="#fd9d24"/><text x="225" y="140" font-size="9" fill="white" text-anchor="middle">11.Villes</text>
  <rect x="270" y="110" width="70" height="50" fill="#bf8b2e"/><text x="305" y="140" font-size="9" fill="white" text-anchor="middle">12.Conso</text>
  <rect x="350" y="110" width="70" height="50" fill="#3f7e44"/><text x="385" y="140" font-size="9" fill="white" text-anchor="middle">13.Climat</text>
  <rect x="430" y="110" width="70" height="50" fill="#0a97d9"/><text x="465" y="140" font-size="9" fill="white" text-anchor="middle">14.Océans</text>
  <rect x="510" y="110" width="70" height="50" fill="#56c02b"/><text x="545" y="140" font-size="9" fill="white" text-anchor="middle">15.Terre</text>
  <rect x="590" y="110" width="70" height="50" fill="#00689d"/><text x="625" y="140" font-size="9" fill="white" text-anchor="middle">16.Paix</text>
  <rect x="310" y="170" width="80" height="50" fill="#19486a"/><text x="350" y="200" font-size="9" fill="white" text-anchor="middle">17.Partenariats</text>
  <!-- Question -->
  <rect x="100" y="240" width="500" height="50" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="265" font-size="11" text-anchor="middle" font-weight="bold">Ces objectifs doivent être atteints d'ici quelle année ?</text>
  <text x="350" y="285" font-size="10" text-anchor="middle" fill="#666">A) 2025 | B) 2030 | C) 2050 | D) 2100</text>
</svg>
