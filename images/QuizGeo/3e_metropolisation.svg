<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#f5f5f5"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle">La métropolisation en France</text>
  <!-- Graphique en barres -->
  <line x1="80" y1="280" x2="550" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <!-- Graduations -->
  <text x="70" y="280" font-size="9" text-anchor="end">0</text>
  <text x="70" y="220" font-size="9" text-anchor="end">5</text>
  <text x="70" y="160" font-size="9" text-anchor="end">10</text>
  <text x="70" y="100" font-size="9" text-anchor="end">15</text>
  <text x="30" y="170" font-size="10" text-anchor="middle" transform="rotate(-90,30,170)">Millions d'hab.</text>
  <!-- Barres des métropoles -->
  <rect x="100" y="80" width="50" height="200" fill="#e74c3c"/>
  <text x="125" y="300" font-size="9" text-anchor="middle">Paris</text>
  <text x="125" y="70" font-size="9" text-anchor="middle" fill="#e74c3c">12,2M</text>
  <rect x="170" y="210" width="50" height="70" fill="#2196f3"/>
  <text x="195" y="300" font-size="9" text-anchor="middle">Lyon</text>
  <rect x="240" y="215" width="50" height="65" fill="#2196f3"/>
  <text x="265" y="300" font-size="9" text-anchor="middle">Marseille</text>
  <rect x="310" y="230" width="50" height="50" fill="#4caf50"/>
  <text x="335" y="300" font-size="9" text-anchor="middle">Toulouse</text>
  <rect x="380" y="235" width="50" height="45" fill="#4caf50"/>
  <text x="405" y="300" font-size="9" text-anchor="middle">Bordeaux</text>
  <rect x="450" y="235" width="50" height="45" fill="#4caf50"/>
  <text x="475" y="300" font-size="9" text-anchor="middle">Lille</text>
  <!-- Question -->
  <rect x="100" y="310" width="400" height="35" fill="white" stroke="#ddd" rx="5"/>
  <text x="300" y="332" font-size="11" text-anchor="middle">Quel phénomène ce graphique illustre-t-il ? (indice : poids de Paris)</text>
</svg>
