<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#f5f5f5"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle">Inégalités urbaines : ville riche / bidonville</text>
  <!-- Quartier riche -->
  <rect x="30" y="60" width="250" height="170" fill="#e3f2fd" stroke="#333"/>
  <text x="155" y="85" font-size="11" text-anchor="middle" font-weight="bold">Quartier aisé</text>
  <rect x="50" y="100" width="60" height="80" fill="#1565c0"/>
  <rect x="55" y="110" width="15" height="15" fill="#fff59d"/>
  <rect x="80" y="110" width="15" height="15" fill="#fff59d"/>
  <rect x="55" y="135" width="15" height="15" fill="#fff59d"/>
  <rect x="80" y="135" width="15" height="15" fill="#fff59d"/>
  <rect x="130" y="90" width="70" height="90" fill="#1976d2"/>
  <rect x="220" y="105" width="45" height="75" fill="#1565c0"/>
  <rect x="60" y="185" width="180" height="15" fill="#9e9e9e"/>
  <ellipse cx="170" cy="210" rx="20" ry="15" fill="#4caf50"/>
  <ellipse cx="220" cy="215" rx="15" ry="12" fill="#66bb6a"/>
  <!-- Bidonville -->
  <rect x="320" y="60" width="250" height="170" fill="#efebe9" stroke="#333"/>
  <text x="445" y="85" font-size="11" text-anchor="middle" font-weight="bold">Bidonville (slum)</text>
  <polygon points="340,180 340,130 360,120 380,130 380,180" fill="#8d6e63"/>
  <polygon points="385,180 385,140 400,135 415,140 415,180" fill="#795548"/>
  <polygon points="420,180 420,135 440,125 460,135 460,180" fill="#6d4c41"/>
  <polygon points="465,180 465,145 480,140 495,145 495,180" fill="#8d6e63"/>
  <polygon points="500,180 500,140 515,130 530,140 530,180" fill="#795548"/>
  <polygon points="355,220 355,185 375,175 395,185 395,220" fill="#6d4c41"/>
  <polygon points="410,220 410,190 425,185 440,190 440,220" fill="#8d6e63"/>
  <polygon points="455,220 455,188 475,178 495,188 495,220" fill="#795548"/>
  <line x1="340" y1="195" x2="530" y2="195" stroke="#5d4037" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Légende -->
  <rect x="100" y="250" width="400" height="80" fill="white" stroke="#ddd" rx="5"/>
  <text x="300" y="275" font-size="11" text-anchor="middle" font-weight="bold">Caractéristiques du bidonville :</text>
  <text x="300" y="295" font-size="10" text-anchor="middle" fill="#666">• Habitat précaire et insalubre</text>
  <text x="300" y="310" font-size="10" text-anchor="middle" fill="#666">• Manque d'eau potable et d'assainissement</text>
  <text x="300" y="325" font-size="10" text-anchor="middle" fill="#666">Dans quel type de pays trouve-t-on le plus de bidonvilles ?</text>
</svg>
