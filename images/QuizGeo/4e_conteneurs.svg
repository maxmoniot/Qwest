<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#e3f2fd"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Le conteneur : symbole de la mondialisation</text>
  <!-- Porte-conteneurs -->
  <path d="M100 250 L600 250 L620 280 L80 280 Z" fill="#37474f" stroke="#333"/>
  <rect x="80" y="260" width="560" height="25" fill="#455a64"/>
  <!-- Conteneurs empilés -->
  <rect x="120" y="160" width="70" height="45" fill="#e74c3c" stroke="#333"/>
  <rect x="120" y="115" width="70" height="45" fill="#2196f3" stroke="#333"/>
  <rect x="120" y="70" width="70" height="45" fill="#4caf50" stroke="#333"/>
  <rect x="200" y="160" width="70" height="45" fill="#ff9800" stroke="#333"/>
  <rect x="200" y="115" width="70" height="45" fill="#9c27b0" stroke="#333"/>
  <rect x="280" y="160" width="70" height="45" fill="#00bcd4" stroke="#333"/>
  <rect x="280" y="115" width="70" height="45" fill="#e74c3c" stroke="#333"/>
  <rect x="280" y="70" width="70" height="45" fill="#ff9800" stroke="#333"/>
  <rect x="360" y="160" width="70" height="45" fill="#2196f3" stroke="#333"/>
  <rect x="360" y="115" width="70" height="45" fill="#4caf50" stroke="#333"/>
  <rect x="440" y="160" width="70" height="45" fill="#9c27b0" stroke="#333"/>
  <rect x="440" y="115" width="70" height="45" fill="#00bcd4" stroke="#333"/>
  <rect x="440" y="70" width="70" height="45" fill="#e74c3c" stroke="#333"/>
  <rect x="520" y="160" width="70" height="45" fill="#ff9800" stroke="#333"/>
  <!-- Cheminée -->
  <rect x="550" y="100" width="30" height="60" fill="#333"/>
  <!-- Eau -->
  <rect x="0" y="285" width="700" height="65" fill="#1565c0"/>
  <!-- Questions -->
  <rect x="100" y="300" width="500" height="40" fill="rgba(255,255,255,0.9)" rx="5"/>
  <text x="350" y="318" font-size="11" text-anchor="middle" font-weight="bold">Le conteneur permet de transporter des marchandises par :</text>
  <text x="350" y="333" font-size="11" text-anchor="middle" fill="#666">A) Bateau uniquement B) Bateau, camion, train (multimodal) C) Avion uniquement</text>
</svg>
