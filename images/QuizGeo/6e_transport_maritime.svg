<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#e3f2fd"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les grandes routes maritimes mondiales</text>
  <!-- Continents simplifiés -->
  <path d="M50 80 L130 70 L160 130 L130 180 L60 160 Z" fill="#a5d6a7" stroke="#666"/>
  <path d="M100 190 L140 200 L120 280 L80 260 Z" fill="#a5d6a7" stroke="#666"/>
  <path d="M200 70 L270 65 L300 110 L280 150 L220 140 Z" fill="#a5d6a7" stroke="#666"/>
  <path d="M210 160 L280 155 L300 250 L250 280 L200 240 Z" fill="#a5d6a7" stroke="#666"/>
  <path d="M320 55 L500 45 L540 110 L500 170 L360 160 Z" fill="#a5d6a7" stroke="#666"/>
  <path d="M550 200 L620 190 L650 260 L610 290 L560 270 Z" fill="#a5d6a7" stroke="#666"/>
  <!-- Routes maritimes -->
  <path d="M140 140 Q200 180 280 130" fill="none" stroke="#1565c0" stroke-width="4" stroke-dasharray="10,5"/>
  <path d="M300 130 Q400 100 480 120" fill="none" stroke="#1565c0" stroke-width="4" stroke-dasharray="10,5"/>
  <path d="M280 200 Q350 280 450 230" fill="none" stroke="#1565c0" stroke-width="4" stroke-dasharray="10,5"/>
  <path d="M500 150 Q540 180 580 220" fill="none" stroke="#1565c0" stroke-width="4" stroke-dasharray="10,5"/>
  <!-- Points stratégiques -->
  <circle cx="270" cy="145" r="12" fill="#e74c3c"/>
  <text x="270" y="149" font-size="11" text-anchor="middle" fill="white" font-weight="bold">A</text>
  <circle cx="310" cy="200" r="12" fill="#e74c3c"/>
  <text x="310" y="204" font-size="11" text-anchor="middle" fill="white" font-weight="bold">B</text>
  <circle cx="540" cy="175" r="12" fill="#e74c3c"/>
  <text x="540" y="179" font-size="11" text-anchor="middle" fill="white" font-weight="bold">C</text>
  <!-- Légende -->
  <rect x="50" y="300" width="600" height="45" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="318" font-size="11" text-anchor="middle" font-weight="bold">Identifiez les passages stratégiques :</text>
  <text x="350" y="336" font-size="10" text-anchor="middle">A = Canal de Suez | B = Cap de Bonne-Espérance | C = Détroit de Malacca</text>
</svg>
