<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#eceff1"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les risques naturels</text>
  <!-- Risque 1: Séisme -->
  <rect x="30" y="50" width="150" height="130" fill="#fff" stroke="#333" rx="5"/>
  <line x1="55" y1="140" x2="75" y2="120" stroke="#f44336" stroke-width="3"/>
  <line x1="75" y1="120" x2="95" y2="150" stroke="#f44336" stroke-width="3"/>
  <line x1="95" y1="150" x2="115" y2="110" stroke="#f44336" stroke-width="3"/>
  <line x1="115" y1="110" x2="135" y2="140" stroke="#f44336" stroke-width="3"/>
  <line x1="135" y1="140" x2="155" y2="130" stroke="#f44336" stroke-width="3"/>
  <rect x="80" y="70" width="50" height="40" fill="#bdbdbd" transform="skewX(-5)"/>
  <circle cx="105" cy="190" r="15" fill="#e74c3c"/>
  <text x="105" y="195" font-size="14" text-anchor="middle" fill="white" font-weight="bold">A</text>
  <!-- Risque 2: Inondation -->
  <rect x="200" y="50" width="150" height="130" fill="#fff" stroke="#333" rx="5"/>
  <rect x="210" y="130" width="130" height="40" fill="#2196f3" opacity="0.7"/>
  <rect x="240" y="90" width="40" height="80" fill="#8d6e63"/>
  <polygon points="240,90 260,60 280,90" fill="#795548"/>
  <ellipse cx="310" cy="110" rx="20" ry="25" fill="#4caf50"/>
  <circle cx="275" cy="190" r="15" fill="#e74c3c"/>
  <text x="275" y="195" font-size="14" text-anchor="middle" fill="white" font-weight="bold">B</text>
  <!-- Risque 3: Cyclone -->
  <rect x="370" y="50" width="150" height="130" fill="#fff" stroke="#333" rx="5"/>
  <circle cx="445" cy="110" r="40" fill="none" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="445" cy="110" r="25" fill="none" stroke="#757575" stroke-width="3"/>
  <circle cx="445" cy="110" r="10" fill="#424242"/>
  <path d="M445 70 Q420 90 445 110 Q470 130 445 150" fill="none" stroke="#616161" stroke-width="2"/>
  <circle cx="445" cy="190" r="15" fill="#e74c3c"/>
  <text x="445" y="195" font-size="14" text-anchor="middle" fill="white" font-weight="bold">C</text>
  <!-- Risque 4: Volcan -->
  <rect x="540" y="50" width="150" height="130" fill="#fff" stroke="#333" rx="5"/>
  <polygon points="615,170 570,170 593,80 637,80 660,170" fill="#795548"/>
  <ellipse cx="615" cy="80" rx="22" ry="8" fill="#f44336"/>
  <path d="M600 75 Q590 50 610 40" fill="none" stroke="#ff9800" stroke-width="3"/>
  <path d="M620 75 Q630 55 625 35" fill="none" stroke="#ff9800" stroke-width="3"/>
  <circle cx="615" cy="190" r="15" fill="#e74c3c"/>
  <text x="615" y="195" font-size="14" text-anchor="middle" fill="white" font-weight="bold">D</text>
  <!-- Légende -->
  <rect x="100" y="220" width="500" height="50" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="245" font-size="12" text-anchor="middle" font-weight="bold">Associez : A=? B=? C=? D=?</text>
  <text x="350" y="262" font-size="11" text-anchor="middle" fill="#666">Séisme | Inondation | Cyclone | Éruption volcanique</text>
</svg>
