<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#f5f5f5"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Carte schématique des densités de population</text>
  <!-- Fond carte -->
  <rect x="50" y="40" width="500" height="250" fill="#e6f3ff" stroke="#333"/>
  <!-- Zones très denses -->
  <ellipse cx="420" cy="120" rx="40" ry="30" fill="#8B0000"/>
  <ellipse cx="150" cy="140" rx="35" ry="25" fill="#8B0000"/>
  <ellipse cx="380" cy="180" rx="45" ry="35" fill="#8B0000"/>
  <!-- Zones moyennement denses -->
  <ellipse cx="280" cy="100" rx="50" ry="35" fill="#FF6347"/>
  <ellipse cx="200" cy="200" rx="40" ry="30" fill="#FF6347"/>
  <!-- Zones peu denses -->
  <rect x="80" y="60" width="60" height="50" fill="#FFE4B5"/>
  <rect x="450" y="200" width="70" height="60" fill="#FFE4B5"/>
  <!-- Légende -->
  <rect x="50" y="300" width="20" height="15" fill="#8B0000"/>
  <text x="75" y="312" font-size="11" fill="#333">Très forte densité (&gt;200 hab/km²)</text>
  <rect x="230" y="300" width="20" height="15" fill="#FF6347"/>
  <text x="255" y="312" font-size="11" fill="#333">Densité moyenne</text>
  <rect x="400" y="300" width="20" height="15" fill="#FFE4B5"/>
  <text x="425" y="312" font-size="11" fill="#333">Faible densité</text>
  <!-- Question -->
  <text x="300" y="340" font-size="12" text-anchor="middle" fill="#666">Quelle couleur représente les foyers de peuplement majeurs ?</text>
</svg>
