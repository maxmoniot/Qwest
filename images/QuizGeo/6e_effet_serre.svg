<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <text x="300" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="white">L'effet de serre</text>
  <!-- Soleil -->
  <circle cx="100" cy="80" r="45" fill="#f39c12"/>
  <text x="100" y="85" font-size="12" text-anchor="middle" fill="#333">SOLEIL</text>
  <!-- Terre -->
  <ellipse cx="300" cy="340" rx="250" ry="50" fill="#27ae60"/>
  <ellipse cx="300" cy="330" rx="200" ry="30" fill="#2ecc71"/>
  <!-- Atmosphère -->
  <ellipse cx="300" cy="250" rx="280" ry="100" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="550" y="200" font-size="10" fill="#3498db">Atmosphère</text>
  <!-- Rayons solaires entrants -->
  <line x1="140" y1="100" x2="250" y2="280" stroke="#f1c40f" stroke-width="3"/>
  <line x1="130" y1="110" x2="300" y2="280" stroke="#f1c40f" stroke-width="3"/>
  <line x1="120" y1="120" x2="350" y2="280" stroke="#f1c40f" stroke-width="3"/>
  <polygon points="250,280 245,265 260,270" fill="#f1c40f"/>
  <polygon points="300,280 295,265 310,270" fill="#f1c40f"/>
  <polygon points="350,280 345,265 360,270" fill="#f1c40f"/>
  <circle cx="180" cy="150" r="18" fill="#e74c3c"/>
  <text x="180" y="155" font-size="14" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <!-- Rayons infrarouges réémis -->
  <line x1="280" y1="290" x2="200" y2="180" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="320" y1="290" x2="350" y2="180" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="270" cy="220" r="18" fill="#e74c3c"/>
  <text x="270" y="225" font-size="14" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <!-- Rayons piégés -->
  <path d="M200 180 Q180 150 220 160 Q260 170 240 200" fill="none" stroke="#e67e22" stroke-width="2"/>
  <path d="M350 180 Q400 150 380 200 Q360 220 380 190" fill="none" stroke="#e67e22" stroke-width="2"/>
  <circle cx="380" cy="160" r="18" fill="#e74c3c"/>
  <text x="380" y="165" font-size="14" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <!-- Légende -->
  <rect x="30" y="365" width="540" height="30" fill="rgba(255,255,255,0.1)" rx="5"/>
  <text x="300" y="385" font-size="11" text-anchor="middle" fill="white">1=Rayonnement solaire 2=Infrarouge terrestre 3=Chaleur piégée - Quel numéro cause le réchauffement ?</text>
</svg>
