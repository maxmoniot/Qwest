<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle">Pyramide des âges - Pays A vs Pays B</text>
  <!-- Axes -->
  <line x1="150" y1="350" x2="150" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="350" x2="450" y2="50" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="350" x2="200" y2="350" stroke="#333"/>
  <line x1="400" y1="350" x2="500" y2="350" stroke="#333"/>
  <!-- Âges -->
  <text x="150" y="45" font-size="10" text-anchor="middle">75+</text>
  <text x="150" y="95" font-size="10" text-anchor="middle">60-74</text>
  <text x="150" y="145" font-size="10" text-anchor="middle">45-59</text>
  <text x="150" y="195" font-size="10" text-anchor="middle">30-44</text>
  <text x="150" y="245" font-size="10" text-anchor="middle">15-29</text>
  <text x="150" y="295" font-size="10" text-anchor="middle">0-14</text>
  <!-- Pays A: Pays développé (pyramide en "as de pique") -->
  <text x="150" y="380" font-size="14" text-anchor="middle" font-weight="bold" fill="#2196f3">PAYS A</text>
  <rect x="130" y="55" width="15" height="35" fill="#2196f3"/>
  <rect x="155" y="55" width="15" height="35" fill="#e91e63"/>
  <rect x="125" y="100" width="20" height="35" fill="#2196f3"/>
  <rect x="155" y="100" width="20" height="35" fill="#e91e63"/>
  <rect x="120" y="150" width="25" height="35" fill="#2196f3"/>
  <rect x="155" y="150" width="25" height="35" fill="#e91e63"/>
  <rect x="118" y="200" width="27" height="35" fill="#2196f3"/>
  <rect x="155" y="200" width="27" height="35" fill="#e91e63"/>
  <rect x="125" y="250" width="20" height="35" fill="#2196f3"/>
  <rect x="155" y="250" width="20" height="35" fill="#e91e63"/>
  <rect x="128" y="300" width="17" height="40" fill="#2196f3"/>
  <rect x="155" y="300" width="17" height="40" fill="#e91e63"/>
  <!-- Pays B: Pays en développement (pyramide classique) -->
  <text x="450" y="380" font-size="14" text-anchor="middle" font-weight="bold" fill="#ff9800">PAYS B</text>
  <rect x="440" y="55" width="5" height="35" fill="#2196f3"/>
  <rect x="455" y="55" width="5" height="35" fill="#e91e63"/>
  <rect x="435" y="100" width="10" height="35" fill="#2196f3"/>
  <rect x="455" y="100" width="10" height="35" fill="#e91e63"/>
  <rect x="428" y="150" width="17" height="35" fill="#2196f3"/>
  <rect x="455" y="150" width="17" height="35" fill="#e91e63"/>
  <rect x="418" y="200" width="27" height="35" fill="#2196f3"/>
  <rect x="455" y="200" width="27" height="35" fill="#e91e63"/>
  <rect x="405" y="250" width="40" height="35" fill="#2196f3"/>
  <rect x="455" y="250" width="40" height="35" fill="#e91e63"/>
  <rect x="395" y="300" width="50" height="40" fill="#2196f3"/>
  <rect x="455" y="300" width="50" height="40" fill="#e91e63"/>
  <!-- Question -->
  <text x="300" y="370" font-size="11" text-anchor="middle" fill="#333">Lequel est un pays en développement avec forte natalité ?</text>
</svg>
