<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Aménagement du territoire français</text>
  <!-- Carte France simplifiée -->
  <path d="M150 80 L250 60 L380 70 L480 120 L500 220 L450 320 L350 370 L220 350 L130 280 L100 180 Z" fill="#e8f5e9" stroke="#333" stroke-width="2"/>
  <!-- Paris et Île-de-France (hypertrophie) -->
  <circle cx="300" cy="150" r="40" fill="#e74c3c" stroke="#333" stroke-width="2"/>
  <text x="300" y="145" font-size="11" text-anchor="middle" fill="white" font-weight="bold">PARIS</text>
  <text x="300" y="160" font-size="9" text-anchor="middle" fill="white">12M hab</text>
  <!-- Métropoles régionales -->
  <circle cx="180" cy="180" r="15" fill="#2196f3" stroke="#333"/>
  <text x="180" y="210" font-size="8" text-anchor="middle">Nantes</text>
  <circle cx="400" cy="280" r="15" fill="#2196f3" stroke="#333"/>
  <text x="400" y="310" font-size="8" text-anchor="middle">Marseille</text>
  <circle cx="420" cy="180" r="15" fill="#2196f3" stroke="#333"/>
  <text x="450" y="180" font-size="8">Lyon</text>
  <circle cx="200" cy="300" r="12" fill="#2196f3" stroke="#333"/>
  <text x="200" y="330" font-size="8" text-anchor="middle">Bordeaux</text>
  <circle cx="280" cy="320" r="12" fill="#2196f3" stroke="#333"/>
  <text x="280" y="350" font-size="8" text-anchor="middle">Toulouse</text>
  <circle cx="130" cy="150" r="10" fill="#2196f3" stroke="#333"/>
  <text x="100" y="150" font-size="8">Rennes</text>
  <!-- Axes de communication (LGV) -->
  <line x1="300" y1="180" x2="420" y2="195" stroke="#ff9800" stroke-width="3"/>
  <line x1="300" y1="175" x2="280" y2="300" stroke="#ff9800" stroke-width="3"/>
  <line x1="300" y1="185" x2="400" y2="265" stroke="#ff9800" stroke-width="3"/>
  <!-- Légende -->
  <rect x="500" y="100" width="180" height="180" fill="white" stroke="#ddd" rx="5"/>
  <text x="590" y="120" font-size="11" text-anchor="middle" font-weight="bold">Légende</text>
  <circle cx="520" cy="145" r="10" fill="#e74c3c"/>
  <text x="540" y="150" font-size="10">Capitale (macrocéphalie)</text>
  <circle cx="520" cy="175" r="8" fill="#2196f3"/>
  <text x="540" y="180" font-size="10">Métropoles régionales</text>
  <line x1="510" y1="205" x2="540" y2="205" stroke="#ff9800" stroke-width="3"/>
  <text x="550" y="210" font-size="10">LGV</text>
  <text x="590" y="250" font-size="9" text-anchor="middle" fill="#666">Question :</text>
  <text x="590" y="265" font-size="9" text-anchor="middle" fill="#666">Qu'est-ce que la</text>
  <text x="590" y="280" font-size="9" text-anchor="middle" fill="#666">"macrocéphalie</text>
  <text x="590" y="295" font-size="9" text-anchor="middle" fill="#666">parisienne" ?</text>
</svg>
