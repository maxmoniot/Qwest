<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#fff"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">La transition démographique</text>
  <!-- Axes -->
  <line x1="70" y1="320" x2="630" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="320" x2="70" y2="50" stroke="#333" stroke-width="2"/>
  <text x="35" y="190" font-size="11" text-anchor="middle" transform="rotate(-90,35,190)">Taux (‰)</text>
  <text x="350" y="345" font-size="11" text-anchor="middle">Temps →</text>
  <!-- Phases -->
  <rect x="70" y="40" width="130" height="280" fill="#ffebee" opacity="0.5"/>
  <rect x="200" y="40" width="140" height="280" fill="#fff3e0" opacity="0.5"/>
  <rect x="340" y="40" width="140" height="280" fill="#e8f5e9" opacity="0.5"/>
  <rect x="480" y="40" width="150" height="280" fill="#e3f2fd" opacity="0.5"/>
  <text x="135" y="60" font-size="10" text-anchor="middle" font-weight="bold">Phase 1</text>
  <text x="270" y="60" font-size="10" text-anchor="middle" font-weight="bold">Phase 2</text>
  <text x="410" y="60" font-size="10" text-anchor="middle" font-weight="bold">Phase 3</text>
  <text x="555" y="60" font-size="10" text-anchor="middle" font-weight="bold">Phase 4</text>
  <!-- Courbe natalité (rouge) -->
  <path d="M70 100 L200 100 Q270 100 340 150 Q410 200 480 250 L630 250" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="650" y="250" font-size="10" fill="#e74c3c">Natalité</text>
  <!-- Courbe mortalité (bleu) -->
  <path d="M70 120 L200 120 Q250 180 300 230 Q350 260 400 270 L630 270" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="650" y="270" font-size="10" fill="#3498db">Mortalité</text>
  <!-- Zone accroissement naturel -->
  <text x="300" y="180" font-size="10" fill="#27ae60" font-weight="bold">Accroissement</text>
  <text x="300" y="195" font-size="10" fill="#27ae60" font-weight="bold">naturel élevé</text>
  <!-- Légende -->
  <rect x="150" y="355" width="400" height="35" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="378" font-size="11" text-anchor="middle">En quelle phase l'accroissement naturel est-il le plus fort ?</text>
</svg>
