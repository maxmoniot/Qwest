<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#e8f5e9"/>
  <text x="400" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les flux de la mondialisation</text>
  <!-- Pôles de la Triade + Chine -->
  <ellipse cx="120" cy="150" rx="60" ry="40" fill="#1976d2" stroke="#333"/>
  <text x="120" y="145" font-size="11" text-anchor="middle" fill="white">Amérique</text>
  <text x="120" y="160" font-size="11" text-anchor="middle" fill="white">du Nord</text>
  <ellipse cx="350" cy="120" rx="50" ry="35" fill="#1976d2" stroke="#333"/>
  <text x="350" y="125" font-size="12" text-anchor="middle" fill="white">Europe</text>
  <ellipse cx="600" cy="140" rx="55" ry="40" fill="#1976d2" stroke="#333"/>
  <text x="600" y="135" font-size="11" text-anchor="middle" fill="white">Asie</text>
  <text x="600" y="150" font-size="11" text-anchor="middle" fill="white">orientale</text>
  <!-- Pays émergents -->
  <ellipse cx="550" cy="220" rx="35" ry="25" fill="#ff9800" stroke="#333"/>
  <text x="550" y="225" font-size="10" text-anchor="middle" fill="white">Chine</text>
  <ellipse cx="450" cy="280" rx="30" ry="20" fill="#ff9800" stroke="#333"/>
  <text x="450" y="285" font-size="9" text-anchor="middle" fill="white">Inde</text>
  <!-- Flux commerciaux -->
  <path d="M180 150 Q270 100 300 120" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M400 120 Q500 90 545 140" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M545 150 Q350 200 180 155" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 210 Q400 180 400 130" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 195 Q580 170 590 165" stroke="#4caf50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- Légende -->
  <rect x="100" y="320" width="600" height="70" fill="white" stroke="#ddd" rx="5"/>
  <ellipse cx="140" cy="345" rx="20" ry="12" fill="#1976d2"/>
  <text x="170" y="350" font-size="11">Pôles de la Triade</text>
  <ellipse cx="300" cy="345" rx="15" ry="10" fill="#ff9800"/>
  <text x="325" y="350" font-size="11">Pays émergents</text>
  <line x1="450" y1="340" x2="500" y2="340" stroke="#e74c3c" stroke-width="3"/>
  <text x="510" y="345" font-size="11">Flux majeurs</text>
  <text x="400" y="375" font-size="12" text-anchor="middle" fill="#333">Quels sont les 3 pôles de la Triade ?</text>
</svg>
