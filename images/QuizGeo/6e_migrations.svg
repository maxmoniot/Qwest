<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <marker id="arrowMig" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#e8f5e9"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les grandes migrations internationales</text>
  <!-- Continents -->
  <ellipse cx="120" cy="150" rx="50" ry="35" fill="#a5d6a7" stroke="#333"/>
  <text x="120" y="155" font-size="10" text-anchor="middle">Amérique N.</text>
  <ellipse cx="120" cy="250" rx="35" ry="45" fill="#a5d6a7" stroke="#333"/>
  <text x="120" y="255" font-size="9" text-anchor="middle">Amérique S.</text>
  <ellipse cx="320" cy="130" rx="45" ry="30" fill="#a5d6a7" stroke="#333"/>
  <text x="320" y="135" font-size="10" text-anchor="middle">Europe</text>
  <ellipse cx="320" cy="230" rx="50" ry="55" fill="#a5d6a7" stroke="#333"/>
  <text x="320" y="235" font-size="10" text-anchor="middle">Afrique</text>
  <ellipse cx="520" cy="150" rx="70" ry="50" fill="#a5d6a7" stroke="#333"/>
  <text x="520" y="155" font-size="10" text-anchor="middle">Asie</text>
  <ellipse cx="600" cy="280" rx="40" ry="30" fill="#a5d6a7" stroke="#333"/>
  <text x="600" y="285" font-size="9" text-anchor="middle">Océanie</text>
  <!-- Flux migratoires -->
  <path d="M350 200 Q340 160 320 145" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowMig)"/>
  <path d="M150 230 Q135 180 130 165" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowMig)"/>
  <path d="M470 160 Q420 145 365 135" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowMig)"/>
  <path d="M520 180 Q550 240 580 265" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowMig)"/>
  <!-- Légende -->
  <rect x="50" y="300" width="600" height="45" fill="white" stroke="#ddd" rx="5"/>
  <line x1="70" y1="320" x2="110" y2="320" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowMig)"/>
  <text x="120" y="325" font-size="10">Flux migratoires majeurs</text>
  <text x="350" y="335" font-size="11" text-anchor="middle" fill="#333">Quel continent est la principale destination des migrants africains ?</text>
</svg>
