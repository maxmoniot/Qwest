<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#e3f2fd"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les territoires ultramarins français (DROM-COM)</text>
  <!-- Carte monde simplifiée -->
  <rect x="50" y="50" width="600" height="280" fill="#bbdefb" stroke="#333"/>
  <!-- France métropolitaine -->
  <ellipse cx="320" cy="120" rx="25" ry="20" fill="#1565c0" stroke="#333"/>
  <text x="320" y="100" font-size="8" fill="#333">France</text>
  <!-- DROM-COM -->
  <!-- Guadeloupe/Martinique -->
  <circle cx="150" cy="180" r="12" fill="#e74c3c" stroke="#333"/>
  <text x="150" y="205" font-size="8" text-anchor="middle">1</text>
  <!-- Guyane -->
  <circle cx="180" cy="220" r="15" fill="#e74c3c" stroke="#333"/>
  <text x="180" y="250" font-size="8" text-anchor="middle">2</text>
  <!-- Réunion -->
  <circle cx="450" cy="240" r="12" fill="#e74c3c" stroke="#333"/>
  <text x="450" y="265" font-size="8" text-anchor="middle">3</text>
  <!-- Mayotte -->
  <circle cx="420" cy="220" r="8" fill="#e74c3c" stroke="#333"/>
  <text x="420" y="240" font-size="7" text-anchor="middle">4</text>
  <!-- Polynésie française -->
  <circle cx="80" cy="260" r="12" fill="#ff9800" stroke="#333"/>
  <text x="80" y="285" font-size="8" text-anchor="middle">5</text>
  <!-- Nouvelle-Calédonie -->
  <circle cx="600" cy="260" r="12" fill="#ff9800" stroke="#333"/>
  <text x="600" y="285" font-size="8" text-anchor="middle">6</text>
  <!-- Légende -->
  <rect x="50" y="340" width="600" height="55" fill="white" stroke="#ddd" rx="5"/>
  <circle cx="80" cy="360" r="8" fill="#e74c3c"/>
  <text x="95" y="365" font-size="10">DROM (Départements et Régions d'Outre-Mer)</text>
  <circle cx="350" cy="360" r="8" fill="#ff9800"/>
  <text x="365" y="365" font-size="10">COM (Collectivités d'Outre-Mer)</text>
  <text x="350" y="385" font-size="10" text-anchor="middle">1=Antilles 2=Guyane 3=Réunion 4=Mayotte 5=Polynésie 6=Nouvelle-Calédonie</text>
</svg>
