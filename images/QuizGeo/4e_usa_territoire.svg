<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Organisation du territoire des États-Unis</text>
  <!-- Contour USA simplifié -->
  <path d="M80 100 L200 80 L350 85 L500 100 L600 150 L580 250 L450 280 L300 290 L150 270 L80 220 Z" fill="#e8f5e9" stroke="#333" stroke-width="2"/>
  <!-- Côte Est - Mégalopole -->
  <ellipse cx="520" cy="150" rx="40" ry="80" fill="#e74c3c" opacity="0.6" stroke="#c62828" stroke-width="2"/>
  <circle cx="520" cy="120" r="12" fill="#1565c0"/>
  <text x="520" y="125" font-size="11" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <!-- Sun Belt -->
  <path d="M150 220 Q300 300 550 250 L540 280 Q300 330 140 250 Z" fill="#ff9800" opacity="0.5" stroke="#e65100" stroke-width="2"/>
  <circle cx="350" cy="270" r="12" fill="#1565c0"/>
  <text x="350" y="275" font-size="11" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <!-- Grandes Plaines -->
  <ellipse cx="300" cy="160" rx="80" ry="60" fill="#4caf50" opacity="0.4" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="300" cy="160" r="12" fill="#1565c0"/>
  <text x="300" y="165" font-size="11" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <!-- Côte Ouest -->
  <ellipse cx="120" cy="170" rx="30" ry="70" fill="#9c27b0" opacity="0.5" stroke="#7b1fa2" stroke-width="2"/>
  <circle cx="120" cy="170" r="12" fill="#1565c0"/>
  <text x="120" y="175" font-size="11" text-anchor="middle" fill="white" font-weight="bold">4</text>
  <!-- Légende -->
  <rect x="50" y="310" width="600" height="80" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="330" font-size="12" text-anchor="middle" font-weight="bold">Identifiez les régions :</text>
  <circle cx="100" cy="355" r="8" fill="#e74c3c" opacity="0.6"/>
  <text x="115" y="360" font-size="10">1 = Mégalopole (BosWash)</text>
  <circle cx="280" cy="355" r="8" fill="#ff9800" opacity="0.5"/>
  <text x="295" y="360" font-size="10">2 = Sun Belt</text>
  <circle cx="430" cy="355" r="8" fill="#4caf50" opacity="0.4"/>
  <text x="445" y="360" font-size="10">3 = Grandes Plaines</text>
  <circle cx="580" cy="355" r="8" fill="#9c27b0" opacity="0.5"/>
  <text x="595" y="360" font-size="10">4 = Californie</text>
  <text x="350" y="382" font-size="11" text-anchor="middle" fill="#666">Quelle région connaît la plus forte croissance démographique ?</text>
</svg>
