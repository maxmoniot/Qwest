<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#ffeaa7"/>
  <text x="300" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Habiter un espace à forte contrainte : le désert</text>
  <!-- Dunes -->
  <ellipse cx="150" cy="280" rx="100" ry="40" fill="#f5d78e"/>
  <ellipse cx="350" cy="260" rx="120" ry="50" fill="#f0c75e"/>
  <ellipse cx="500" cy="290" rx="80" ry="35" fill="#f5d78e"/>
  <!-- Soleil intense -->
  <circle cx="520" cy="80" r="50" fill="#f39c12"/>
  <line x1="520" y1="20" x2="520" y2="0" stroke="#f39c12" stroke-width="4"/>
  <line x1="580" y1="80" x2="600" y2="80" stroke="#f39c12" stroke-width="4"/>
  <line x1="565" y1="35" x2="585" y2="15" stroke="#f39c12" stroke-width="4"/>
  <!-- Oasis -->
  <ellipse cx="200" cy="230" rx="60" ry="30" fill="#3498db"/>
  <rect x="170" y="180" width="8" height="50" fill="#8B4513"/>
  <ellipse cx="174" cy="175" rx="25" ry="15" fill="#27ae60"/>
  <rect x="210" y="190" width="8" height="40" fill="#8B4513"/>
  <ellipse cx="214" cy="185" rx="22" ry="12" fill="#27ae60"/>
  <circle cx="200" cy="200" r="15" fill="#e74c3c"/>
  <text x="200" y="205" font-size="12" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <!-- Nomade avec chameau -->
  <ellipse cx="400" cy="210" rx="25" ry="15" fill="#c9a86c"/>
  <ellipse cx="400" cy="195" rx="8" ry="12" fill="#c9a86c"/>
  <circle cx="400" cy="178" r="6" fill="#c9a86c"/>
  <circle cx="420" cy="200" r="15" fill="#e74c3c"/>
  <text x="420" y="205" font-size="12" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <!-- Ville moderne (Dubaï style) -->
  <rect x="60" y="150" width="30" height="80" fill="#95a5a6"/>
  <rect x="50" y="130" width="20" height="100" fill="#7f8c8d"/>
  <rect x="75" y="160" width="25" height="70" fill="#bdc3c7"/>
  <circle cx="70" cy="140" r="15" fill="#e74c3c"/>
  <text x="70" y="145" font-size="12" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <!-- Légende -->
  <rect x="50" y="300" width="500" height="40" fill="rgba(255,255,255,0.9)" rx="5"/>
  <text x="300" y="320" font-size="11" text-anchor="middle">1 = Oasis traditionnelle  |  2 = Nomadisme  |  3 = Ville moderne climatisée</text>
  <text x="300" y="335" font-size="10" text-anchor="middle" fill="#666">Quelle adaptation permet l'agriculture dans le désert ?</text>
</svg>
