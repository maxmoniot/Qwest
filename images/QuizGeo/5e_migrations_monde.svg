<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <marker id="arrMig2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#e8f4f8"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Les grandes migrations internationales</text>
  <!-- Continents simplifiés -->
  <ellipse cx="130" cy="140" rx="55" ry="40" fill="#a5d6a7" stroke="#333"/>
  <text x="130" y="145" font-size="9" text-anchor="middle">Amérique N.</text>
  <ellipse cx="130" cy="240" rx="40" ry="50" fill="#a5d6a7" stroke="#333"/>
  <text x="130" y="245" font-size="9" text-anchor="middle">Amérique S.</text>
  <ellipse cx="340" cy="130" rx="50" ry="35" fill="#a5d6a7" stroke="#333"/>
  <text x="340" y="135" font-size="10" text-anchor="middle">Europe</text>
  <ellipse cx="340" cy="230" rx="55" ry="60" fill="#a5d6a7" stroke="#333"/>
  <text x="340" y="235" font-size="10" text-anchor="middle">Afrique</text>
  <ellipse cx="520" cy="150" rx="70" ry="50" fill="#a5d6a7" stroke="#333"/>
  <text x="520" y="145" font-size="9" text-anchor="middle">Asie</text>
  <ellipse cx="600" cy="270" rx="35" ry="30" fill="#a5d6a7" stroke="#333"/>
  <text x="600" y="275" font-size="8" text-anchor="middle">Océanie</text>
  <!-- Flux migratoires avec flèches -->
  <path d="M370 190 Q355 160 350 150" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrMig2)"/>
  <path d="M160 220 Q145 175 140 160" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrMig2)"/>
  <path d="M480 165 Q420 145 385 135" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrMig2)"/>
  <path d="M160 130 Q120 125 115 125" stroke="#ff9800" stroke-width="2" fill="none"/>
  <path d="M380 200 Q430 150 480 140" stroke="#ff9800" stroke-width="2" fill="none"/>
  <!-- Légende -->
  <rect x="100" y="300" width="500" height="45" fill="white" stroke="#ddd" rx="5"/>
  <line x1="120" y1="320" x2="160" y2="320" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrMig2)"/>
  <text x="175" y="325" font-size="10">Flux majeurs (Sud → Nord)</text>
  <text x="350" y="335" font-size="11" text-anchor="middle" fill="#333">Pourquoi les migrants se dirigent-ils vers l'Europe et l'Amérique du Nord ?</text>
</svg>
