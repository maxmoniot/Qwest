<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <rect width="700" height="380" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Accès à l'eau potable dans le monde</text>
  <!-- Carte simplifiée avec codes couleur -->
  <!-- Amérique du Nord -->
  <path d="M60 80 L150 70 L180 130 L150 180 L70 160 Z" fill="#1565c0" stroke="#333"/>
  <!-- Amérique du Sud -->
  <path d="M120 190 L170 200 L150 290 L100 270 Z" fill="#64b5f6" stroke="#333"/>
  <!-- Europe -->
  <path d="M290 70 L360 65 L390 100 L370 140 L310 135 Z" fill="#1565c0" stroke="#333"/>
  <!-- Afrique -->
  <path d="M290 150 L370 145 L395 250 L340 280 L275 245 Z" fill="#ef5350" stroke="#333"/>
  <!-- Asie -->
  <path d="M400 55 L560 45 L600 110 L560 170 L440 160 Z" fill="#ffb74d" stroke="#333"/>
  <!-- Océanie -->
  <path d="M580 210 L650 200 L680 260 L640 290 Z" fill="#1565c0" stroke="#333"/>
  <!-- Légende -->
  <rect x="50" y="310" width="600" height="60" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="328" font-size="12" text-anchor="middle" font-weight="bold">Accès à l'eau potable (% population)</text>
  <rect x="80" y="340" width="25" height="15" fill="#1565c0"/>
  <text x="110" y="352" font-size="10">&gt;95%</text>
  <rect x="180" y="340" width="25" height="15" fill="#64b5f6"/>
  <text x="210" y="352" font-size="10">80-95%</text>
  <rect x="290" y="340" width="25" height="15" fill="#ffb74d"/>
  <text x="320" y="352" font-size="10">60-80%</text>
  <rect x="400" y="340" width="25" height="15" fill="#ef5350"/>
  <text x="430" y="352" font-size="10">&lt;60%</text>
  <text x="550" y="352" font-size="11" fill="#666">Quel continent est le plus touché ?</text>
</svg>
