<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Organisation d'une FTN (Firme Transnationale)</text>
  <!-- Siège social -->
  <rect x="280" y="60" width="140" height="80" fill="#1565c0" stroke="#333" stroke-width="2"/>
  <text x="350" y="95" font-size="12" text-anchor="middle" fill="white" font-weight="bold">SIÈGE SOCIAL</text>
  <text x="350" y="115" font-size="10" text-anchor="middle" fill="white">(Pays développé)</text>
  <text x="350" y="130" font-size="9" text-anchor="middle" fill="#bbdefb">Direction, R&D</text>
  <!-- Filiales -->
  <rect x="50" y="200" width="120" height="70" fill="#4caf50" stroke="#333"/>
  <text x="110" y="225" font-size="10" text-anchor="middle" fill="white" font-weight="bold">USINE A</text>
  <text x="110" y="245" font-size="9" text-anchor="middle" fill="white">Pays émergent</text>
  <text x="110" y="260" font-size="8" text-anchor="middle" fill="#c8e6c9">Production</text>
  <rect x="220" y="220" width="120" height="70" fill="#ff9800" stroke="#333"/>
  <text x="280" y="245" font-size="10" text-anchor="middle" fill="white" font-weight="bold">USINE B</text>
  <text x="280" y="265" font-size="9" text-anchor="middle" fill="white">Asie du Sud-Est</text>
  <text x="280" y="280" font-size="8" text-anchor="middle" fill="#ffe0b2">Assemblage</text>
  <rect x="390" y="200" width="120" height="70" fill="#9c27b0" stroke="#333"/>
  <text x="450" y="225" font-size="10" text-anchor="middle" fill="white" font-weight="bold">FILIALE C</text>
  <text x="450" y="245" font-size="9" text-anchor="middle" fill="white">Europe</text>
  <text x="450" y="260" font-size="8" text-anchor="middle" fill="#e1bee7">Distribution</text>
  <rect x="540" y="220" width="120" height="70" fill="#00bcd4" stroke="#333"/>
  <text x="600" y="245" font-size="10" text-anchor="middle" fill="white" font-weight="bold">FILIALE D</text>
  <text x="600" y="265" font-size="9" text-anchor="middle" fill="white">Amérique</text>
  <text x="600" y="280" font-size="8" text-anchor="middle" fill="#b2ebf2">Vente</text>
  <!-- Flèches -->
  <line x1="310" y1="140" x2="140" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="140" x2="280" y2="215" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="140" x2="450" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="140" x2="570" y2="215" stroke="#333" stroke-width="2"/>
  <!-- Question -->
  <rect x="150" y="300" width="400" height="40" fill="white" stroke="#ddd" rx="5"/>
  <text x="350" y="325" font-size="11" text-anchor="middle">Pourquoi les FTN délocalisent-elles leur production ?</text>
</svg>
