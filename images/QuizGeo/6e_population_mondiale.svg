<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="30" font-size="16" font-weight="bold" text-anchor="middle">Évolution de la population mondiale</text>
  <!-- Axes -->
  <line x1="80" y1="320" x2="550" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#333" stroke-width="2"/>
  <!-- Graduations Y -->
  <text x="70" y="320" font-size="10" text-anchor="end">0</text>
  <text x="70" y="255" font-size="10" text-anchor="end">2</text>
  <text x="70" y="190" font-size="10" text-anchor="end">4</text>
  <text x="70" y="125" font-size="10" text-anchor="end">6</text>
  <text x="70" y="75" font-size="10" text-anchor="end">8</text>
  <text x="30" y="190" font-size="11" text-anchor="middle" transform="rotate(-90,30,190)">Milliards d'habitants</text>
  <!-- Graduations X -->
  <text x="100" y="340" font-size="10" text-anchor="middle">1800</text>
  <text x="200" y="340" font-size="10" text-anchor="middle">1900</text>
  <text x="300" y="340" font-size="10" text-anchor="middle">1950</text>
  <text x="400" y="340" font-size="10" text-anchor="middle">2000</text>
  <text x="500" y="340" font-size="10" text-anchor="middle">2050</text>
  <!-- Courbe -->
  <path d="M100 305 Q150 300 200 285 Q250 260 300 210 Q350 140 400 100 Q450 80 500 75" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <!-- Points -->
  <circle cx="100" cy="305" r="5" fill="#e74c3c"/>
  <circle cx="200" cy="285" r="5" fill="#e74c3c"/>
  <circle cx="300" cy="210" r="5" fill="#e74c3c"/>
  <circle cx="400" cy="100" r="5" fill="#e74c3c"/>
  <circle cx="500" cy="75" r="5" fill="#f39c12"/>
  <!-- Annotations -->
  <text x="110" y="295" font-size="9" fill="#333">1 Md</text>
  <text x="310" y="200" font-size="9" fill="#333">2,5 Md</text>
  <text x="410" y="90" font-size="9" fill="#333">6 Md</text>
  <text x="500" y="65" font-size="9" fill="#f39c12">~10 Md ?</text>
  <!-- Question -->
  <rect x="150" y="360" width="300" height="30" fill="#f0f0f0" rx="5"/>
  <text x="300" y="380" font-size="12" text-anchor="middle" fill="#333">En quelle année la population a-t-elle dépassé 6 milliards ?</text>
</svg>
