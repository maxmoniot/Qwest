<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <rect width="700" height="350" fill="#f5f5f5"/>
  <text x="350" y="25" font-size="16" font-weight="bold" text-anchor="middle">Sources d'énergie : renouvelables ou fossiles ?</text>
  <!-- Énergie 1: Éolienne -->
  <rect x="30" y="60" width="130" height="130" fill="#e3f2fd" stroke="#333" rx="5"/>
  <line x1="95" y1="180" x2="95" y2="100" stroke="#666" stroke-width="4"/>
  <circle cx="95" cy="100" r="8" fill="#666"/>
  <line x1="95" y1="100" x2="95" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="100" x2="65" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="95" y1="100" x2="125" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="95" cy="200" r="15" fill="#4caf50"/>
  <text x="95" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">1</text>
  <!-- Énergie 2: Pétrole -->
  <rect x="180" y="60" width="130" height="130" fill="#ffebee" stroke="#333" rx="5"/>
  <rect x="220" y="90" width="50" height="80" fill="#333"/>
  <rect x="230" y="75" width="30" height="20" fill="#666"/>
  <ellipse cx="245" cy="180" rx="30" ry="8" fill="#1a1a1a"/>
  <circle cx="245" cy="200" r="15" fill="#f44336"/>
  <text x="245" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">2</text>
  <!-- Énergie 3: Solaire -->
  <rect x="330" y="60" width="130" height="130" fill="#e3f2fd" stroke="#333" rx="5"/>
  <rect x="355" y="100" width="80" height="50" fill="#1565c0" stroke="#333"/>
  <line x1="365" y1="100" x2="365" y2="150" stroke="#87ceeb" stroke-width="1"/>
  <line x1="385" y1="100" x2="385" y2="150" stroke="#87ceeb" stroke-width="1"/>
  <line x1="405" y1="100" x2="405" y2="150" stroke="#87ceeb" stroke-width="1"/>
  <line x1="425" y1="100" x2="425" y2="150" stroke="#87ceeb" stroke-width="1"/>
  <line x1="355" y1="125" x2="435" y2="125" stroke="#87ceeb" stroke-width="1"/>
  <circle cx="395" cy="75" r="15" fill="#ffc107"/>
  <circle cx="395" cy="200" r="15" fill="#4caf50"/>
  <text x="395" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">3</text>
  <!-- Énergie 4: Charbon -->
  <rect x="480" y="60" width="130" height="130" fill="#ffebee" stroke="#333" rx="5"/>
  <polygon points="545,90 570,180 520,180" fill="#333"/>
  <ellipse cx="545" cy="180" rx="25" ry="8" fill="#1a1a1a"/>
  <rect x="530" y="85" width="10" height="25" fill="#666"/>
  <ellipse cx="535" cy="80" rx="15" ry="8" fill="#9e9e9e"/>
  <circle cx="545" cy="200" r="15" fill="#f44336"/>
  <text x="545" y="205" font-size="14" text-anchor="middle" fill="white" font-weight="bold">4</text>
  <!-- Légende -->
  <rect x="100" y="230" width="500" height="60" fill="white" stroke="#ddd" rx="5"/>
  <circle cx="150" cy="255" r="12" fill="#4caf50"/>
  <text x="170" y="260" font-size="12">= Renouvelable</text>
  <circle cx="320" cy="255" r="12" fill="#f44336"/>
  <text x="340" y="260" font-size="12">= Fossile (non renouvelable)</text>
  <text x="350" y="280" font-size="11" text-anchor="middle" fill="#666">Classez chaque énergie dans la bonne catégorie</text>
  <!-- Labels -->
  <text x="95" y="220" font-size="10" text-anchor="middle">Éolienne</text>
  <text x="245" y="220" font-size="10" text-anchor="middle">Pétrole</text>
  <text x="395" y="220" font-size="10" text-anchor="middle">Solaire</text>
  <text x="545" y="220" font-size="10" text-anchor="middle">Charbon</text>
</svg>
